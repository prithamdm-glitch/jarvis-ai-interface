<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hud-container">
        <div class="jarvis-core" id="jarvisCore">
            <div class="ring outer-ring"></div>
            <div class="ring inner-ring"></div>
            <div class="core-text">JARVIS</div>
        </div>
        <div class="hud-panel" id="statusPanel">
            <h3>Estado del Sistema</h3>
            <p id="statusText">Esperando comando de voz...</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
